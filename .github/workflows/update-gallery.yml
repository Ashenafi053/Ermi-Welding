# Rebuilds js/images.js whenever a photo is added to or removed from images/
name: Update gallery list

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (used to read photo sizes)
        run: pip install pillow

      - name: Rebuild the gallery list
        run: python tools/build_gallery.py

      - name: Save the new list
        run: |
          if [ -n "$(git status --porcelain js/images.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/images.js
            git commit -m "Update gallery list"
            git push
          else
            echo "Gallery list is already up to date."
          fi
